[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viberadio-similarity-lab"
version = "0.1.0"
description = "PC analysis for VibeRadio song similarity and channel placement (Similarity plan, Phase 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only `vrlab extract` (running ONNX models on a PC) needs these.
models = ["onnxruntime>=1.16"]

[project.scripts]
vrlab = "vrlab.cli:main"

[tool.setuptools]
packages = ["vrlab"]
