name: Release

# Builds a signed release APK and publishes it as a GitHub Release. Two ways to start it:
#   - Actions tab -> Release -> Run workflow on main, with a version such as 1.2.3.
#     The workflow creates the v1.2.3 tag on that main commit itself.
#   - Push a v1.2.3 tag.
# Versions: 1.2.3 -> release; 1.2.3-beta.4 -> pre-release (also -alpha.N and -rc.N, N below 30).
# Obtainium follows this repo's releases; its "include pre-releases" toggle picks the track.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 or 0.2.0-beta.1 (no leading v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Parse tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Run the release workflow on main, not $REF_NAME"
              exit 1
            fi
            TAG="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; pick a new version"
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-(alpha|beta|rc)\.(0|[1-9]|[12][0-9]))?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-(alpha|beta|rc).N (MINOR and PATCH below 100, N below 30)"
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBERADIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VIBERADIO_KEYSTORE_BASE64 is not set; see CLAUDE.md (Releases)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "VIBERADIO_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test and build signed release APK
        env:
          VIBERADIO_KEYSTORE_PASSWORD: ${{ secrets.VIBERADIO_KEYSTORE_PASSWORD }}
          VIBERADIO_KEY_ALIAS: ${{ secrets.VIBERADIO_KEY_ALIAS }}
          VIBERADIO_KEY_PASSWORD: ${{ secrets.VIBERADIO_KEY_PASSWORD }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease "-Pviberadio.versionName=$VERSION"

      - name: Verify signature and rename APK
        id: apk
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::$src missing; the release build was not signed"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$src"
          dest="viberadio-$VERSION.apk"
          mv "$src" "$dest"
          sha256sum "$dest" > "$dest.sha256"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          args=(--title "VibeRadio $VERSION" --generate-notes)
          # A pushed tag must already exist; a manual run creates it on the commit just built.
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--target "$GITHUB_SHA"); else args+=(--verify-tag); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
          gh release create "$TAG" "$APK" "$APK.sha256" "${args[@]}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
