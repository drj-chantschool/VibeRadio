name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single required check for branch protection. Keep this job name stable:
  # the "Protect main" ruleset requires a status check named "check".
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # assembleRelease runs R8 and the release lint checks; it stays unsigned here.
      - name: Build, lint and unit test
        run: ./gradlew --no-daemon assembleDebug assembleRelease lint testDebugUnitTest --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: viberadio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The PC similarity lab (tools/similarity-lab). Not part of the required "check".
  similarity-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/similarity-lab
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg is preinstalled on the runner image; the decode test skips without it.
      - name: Install
        run: pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
