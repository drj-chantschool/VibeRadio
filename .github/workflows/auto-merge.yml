name: Auto-merge

# Merges a PR once its CI run passes, then starts CI on main. A merge made with the Actions
# token is a push that starts no workflows, so main would get no CI run and Auto-release
# would never fire; dispatching CI (workflow_dispatch is exempt) is what starts that chain.
# Needs merge commits enabled. The ruleset's required `check` is still enforced by the merge.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

# One at a time, so two PRs finishing together merge one after the other.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    # Same-repo PR branches only (fork runs carry no write token and no pull_requests list).
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the PR and start CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PR" ]; then
            echo "CI run has no pull request; nothing to merge"
            exit 0
          fi
          read -r state draft head < <(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .draft, .head.sha] | @tsv')
          if [ "$state" != open ] || [ "$draft" = true ]; then
            echo "PR #$PR is $state (draft: $draft); not merging"
            exit 0
          fi
          # A newer push has its own CI run, which will merge it.
          if [ "$head" != "$CI_SHA" ]; then
            echo "PR #$PR head moved on to $head; leaving the merge to its CI run"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$CI_SHA"
          gh workflow run ci.yml --repo "$REPO" --ref main
