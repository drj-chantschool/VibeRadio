name: Auto-merge

# Arms auto-merge on every PR, so it merges itself once the required `check`
# job passes. Replaces the per-session ccr/auto_merge call.
# Needs Settings -> General -> "Allow auto-merge" and merge commits enabled.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Fork PRs get a read-only token, and drafts can't be auto-merged.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
